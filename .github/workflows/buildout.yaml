name: Build MTK Payloads (Sequential)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-all-payloads:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM GCC Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Create Global Payloads Directory
        run: mkdir -p payloads

      - name: Build All Folders Sequentially
        run: |
          # Define the sequence of folders to build
          TARGET_FOLDERS=("libsej" "da_x" "da_xml" "extloader" "brom_defuse" "hakujoudai")
          
          for folder in "${TARGET_FOLDERS[@]}"; do
            echo "=================================================="
            echo "🔨 Starting Build for: $folder"
            echo "=================================================="
            
            if [ -d "$folder" ]; then
              cd "$folder"
              if [ -f "Makefile" ] || [ -f "makefile" ]; then
                make clean || true
                make
                echo "✅ Successfully completed: $folder"
              else
                echo "⚠️ No Makefile found in $folder. Skipping compilation step."
              fi
              cd ..
            else
              echo "❌ Folder $folder missing from workspace. Skipping."
            fi
          done

      - name: Upload All Compiled Payloads
        uses: actions/upload-artifact@v4
        with:
          name: all-mtk-payloads-binaries
          path: payloads/
          if-no-files-found: error
          
